<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Document Chatbot</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- FontAwesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-brain text-primary fs-4"></i>
        <div>
          <h1 class="h5 m-0 fw-bold">DocuMind AI</h1>
          <small class="text-muted" id="status-text">Ready to chat</small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <!-- Dark Mode Switch -->
        <div class="form-check form-switch m-0">
          <input
            class="form-check-input"
            type="checkbox"
            id="light-dark-mode-switch"
          />
          <label class="form-check-label" for="light-dark-mode-switch">
            <i class="fa-solid fa-moon"></i>
          </label>
        </div>
        <!-- Reset Button -->
        <button id="reset-button" class="btn btn-sm btn-outline-secondary" title="Reset Chat">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Message Display Area -->
    <main id="message-list" class="chat-messages">
      <div class="message-line">
        <div class="message-box bot-text">
          👋 Hello! Upload a PDF using the attachment button below, and I will answer questions about its content.
        </div>
      </div>
    </main>

    <!-- Loading Animation -->
    <div class="loading-animation" style="display: none;">
      <div class="loading-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Input Footer -->
    <footer class="chat-footer">
      <div class="input-group">
        <!-- File Upload Button -->
        <label class="btn btn-outline-primary upload-label" title="Upload PDF">
          <i class="fa-solid fa-paperclip"></i>
          <input type="file" id="file-upload" accept="application/pdf" hidden />
        </label>

        <!-- Text Input -->
        <input
          type="text"
          id="message-input"
          class="form-control"
          placeholder="Ask a question about your document..."
          autocomplete="off"
        />

        <!-- Send Button -->
        <button id="send-button" class="btn btn-primary" type="button">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </footer>
  </div>

  <!-- jQuery & Custom Script -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
